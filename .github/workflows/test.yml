name: Terraform Deployment with SonarQube

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # =========================================================
  # 1. SONARQUBE ANALYSIS
  # =========================================================
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # =========================================================
  # 2. TERRAFORM PLAN
  # =========================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: sonar
    environment: development

    env:
      WORKSPACE_NAME: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264642482087:role/cicd
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ env.WORKSPACE_NAME }} || \
          terraform workspace new ${{ env.WORKSPACE_NAME }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan


  # =========================================================
  # 3. TERRAFORM APPLY
  # =========================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: development

    env:
      WORKSPACE_NAME: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264642482087:role/cicd
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Workspace
        run: |
          terraform workspace select ${{ env.WORKSPACE_NAME }} || \
          terraform workspace new ${{ env.WORKSPACE_NAME }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
